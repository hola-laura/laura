<section class="slide dark was-light" data-n="06" data-k="bets"><div class="eyebrow a mz-kicker">Habito</div><h1 class="a" style="--d:1">Four bets, and how each one could be wrong</h1>
<div class="bets">
  <div class="bets-head a" style="--d:2"><span></span><span>We believed</span><span>We’d know it works if</span><span>I’d change course if</span></div>
  <div class="bet a" style="--d:3"><div class="bet-name"><em>Bet 1</em>Say what it is</div>
    <p>People expect a comparison site, so a broker’s questions feel like a bait-and-switch.<small>From my research: in-house surveys and support conversations</small></p>
    <p>Fewer people leave at the first broker questions, and more reach a recommendation.</p>
    <p>That step doesn’t move. Then the cause is effort, not expectation.</p></div>
  <div class="bet a" style="--d:4"><div class="bet-name"><em>Bet 2</em>A recommendation you can trust</div>
    <p>People can see the deal but can’t decide: no reasons, no real cost, no next step.<small>From the insight workshop, my audit, and a view-only first version (+5%)</small></p>
    <p>People open the reasons, and more accept, sooner.</p>
    <p>People read everything and still don’t accept. Then it’s the deal itself, and that’s Habito’s side.</p></div>
  <div class="bet a" style="--d:5"><div class="bet-name"><em>Bet 3</em>The adviser in the app</div>
    <p>People want to ask a human before committing, and leaving Monzo to do it breaks momentum.<small>From customer research</small></p>
    <p>More people talk to their adviser before deciding, and more accept.</p>
    <p>More than 5% of chats land in the wrong place. Agreed up front: roll back.</p></div>
  <div class="bet a" style="--d:6"><div class="bet-name"><em>Bet 4</em>The application in Monzo</div>
    <p>The form loses people because it is long, off-app and typed from scratch.<small>From 2025 funnel data</small></p>
    <p>More people finish each step, and come back after saving.</p>
    <p>More finish the form but accepted recommendations don’t move. Then the form wasn’t the constraint.</p></div>
</div>
<p class="note a" style="--d:7">One business outcome for all four: more accepted recommendations. Each bet also has its own early signal, so we know why the number moves.</p></section>
<section class="slide dark was-light" data-n="07" data-k="rec"><div class="eyebrow a mz-kicker">Habito<span class="mz-pill">Bet 2 of 4</span></div><h1 class="a" style="--d:1">The quick win: tell people the moment it’s ready</h1>

<section class="slide dark was-light" data-n="09" data-k="d5"><div class="eyebrow a mz-kicker">Habito<span class="mz-pill">Bet 4 of 4</span></div><h1 class="a" style="--d:1">Move the application into Monzo, pre-filled</h1>
<div class="phones-row ctx" style="margin-top:24px;gap:26px;align-items:stretch">
  <div class="col reach-col" style="flex:1;gap:12px;min-width:0">
    <div class="card  a" style="--d:3;"><div class="label">Problem</div><p class="strong">The application form lived on the broker’s website, and it had around 200 questions. With Better, in 2025, almost half of people dropped out there (Better’s own figure).</p></div>
