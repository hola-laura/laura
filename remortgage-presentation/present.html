<section class="slide dark was-light" data-n="08" data-k="research">
<div class="halfpanel pinkp"></div>
<div style="position:relative;width:860px">
  <div class="eyebrow a mz-kicker">The reset</div><h1 class="a" style="--d:1">Customers wanted one journey, but not the same one</h1>
  <div class="fgrid"><div class="fcard a" style="--d:3"><i>01</i><h3>“Don’t send me out.”</h3><p>They expected to <mark>get the new deal inside Monzo</mark>, not on another website.</p><div class="fviz"><img class="spot" src="assets/img/spot-app.png" alt=""><div class="fviz-r"><span class="chip dark">Monzo</span><span class="farrow"></span><span class="chip ghost">Better’s site</span></div></div></div><div class="fcard a" style="--d:4"><i>02</i><h3>“Use what you know.”</h3><p><mark>Reuse the data Monzo already holds</mark>, instead of asking again.</p><div class="fviz"><img class="spot" src="assets/img/spot-form.png" alt=""><div class="fviz-r"><span class="chip ok">Income</span><span class="chip ok">Mortgage balance</span><span class="chip ok">Address</span></div></div></div><div class="fcard a" style="--d:5"><i>03</i><h3>“Let me choose.”</h3><p>Some wanted a call for reassurance; others wanted to <mark>self-serve, with a human on hand</mark>.</p><div class="fviz"><img class="spot" src="assets/img/spot-chat.png" alt=""><div class="fviz-r"><span class="chip">Chat</span><span class="chip">Phone</span><span class="chip">Email</span></div></div></div><div class="fcard a" style="--d:6"><i>04</i><h3>“Tell me what’s happening.”</h3><p><mark>The wait</mark> was the most stressful part.</p><div class="fviz"><img class="spot" src="assets/img/spot-bell.png" alt=""><div class="fviz-r"><span class="push"><em>M</em><span><b>Monzo</b> Your application has moved to the next step</span></span></div></div></div></div>
</div>
<div class="bubbles personas">
  <div class="persona a" style="--d:4"><span class="av" style="background-image:url(https://images.ctfassets.net/ro61k101ee59/3YYXrc8ROFsNIHk5xhHYTK/bb95db66949cc82ae8acd34e0113c9b1/Image__6_.png?w=1600&fm=webp&q=80);background-position:-46px -72px"></span><div><small>Remortgaged with us</small><h3>George</h3><p>Got his new deal, but was frustrated at being sent to a partner’s website to do it.</p></div></div>
  <div class="persona a" style="--d:5"><span class="av" style="background-image:url(https://images.ctfassets.net/ro61k101ee59/3YYXrc8ROFsNIHk5xhHYTK/bb95db66949cc82ae8acd34e0113c9b1/Image__6_.png?w=1600&fm=webp&q=80);background-position:-358px -128px"></span><div><small>Started, then dropped out</small><h3>Carla</h3><p>Gave up when she hit the friction of doing it all outside the app.</p></div></div>

<section class="slide dark" data-n="09" data-k="vision">
<div class="design">
  <div class="design-copy">
    <div class="eyebrow a mz-kicker">The vision</div>
    <h1 class="a" style="--d:1">One journey, inside Monzo, that flexes to you</h1>
    <ul class="design-points"><li class="a" style="--d:3"><b>01 · The application, in the app.</b> Pre-filled with what Monzo already knows.</li><li class="a" style="--d:4"><b>02 · Choose how you talk to an adviser.</b> An adviser first, or deals first.</li><li class="a" style="--d:5"><b>03 · Take the pain out of paperwork.</b> Documents, straight from your phone.</li><li class="a" style="--d:6"><b>04 · Always know what’s next.</b> One tracker, from first look to completion.</li></ul>
    <p class="note a" style="--d:8;color:#9fb0b8!important;margin-top:14px!important">It became the team’s North Star and part of the case for a new partnership model.</p><div class="a vision-links" style="--d:8;display:flex;flex-wrap:wrap;gap:10px;margin-top:14px"><a class="fig-link ghost" style="margin-top:0;color:#fff;border-color:rgba(255,255,255,.4)" href="https://monzo.com/blog/slowing-down-to-speed-up-how-a-2-month-engineering-pause-rebooted-our-mortgage-strategy" target="_blank" rel="noopener">Read the Monzo blog post ↗</a><a class="fig-link ghost" style="margin-top:0;color:#fff;border-color:rgba(255,255,255,.4)" href="https://www.figma.com/design/auJMcyTUagjoT1qWHXPAzR/Remortgage-experience-vision?node-id=719-20935&t=fLzNMSg7tPnlWpjz-1" target="_blank" rel="noopener">See the full vision in Figma ↗</a></div>
  </div>

</div></section>
<section class="slide dark was-light" data-n="10" data-k="plan"><div class="eyebrow a mz-kicker">The vision</div><h1 class="a" style="--d:1">I turned the vision into bets the team could ship</h1>

<section class="slide dark was-light" data-n="11" data-k="d1"><div class="eyebrow a mz-kicker">Reach</div><h1 class="a" style="--d:1">Reach people before they’re ready to remortgage</h1>

<section class="slide dark was-light" data-n="15" data-k="bets"><div class="eyebrow a mz-kicker">Habito</div><h1 class="a" style="--d:1">Four bets, and how each one could be wrong</h1>
<div class="bets">
  <div class="bets-head a" style="--d:2"><span></span><span>We believed</span><span>We’d know it works if</span><span>I’d change course if</span></div>
  <div class="bet a" style="--d:3"><div class="bet-name"><em>Bet 1</em>Say what it is</div>
    <p>People expect a comparison site, so a broker’s questions feel like a bait-and-switch.<small>From my research: in-house surveys and support conversations</small></p>
    <p>Fewer people leave at the first broker questions, and more reach a recommendation.</p>
    <p>That step doesn’t move. Then the cause is effort, not expectation.</p></div>
  <div class="bet a" style="--d:4"><div class="bet-name"><em>Bet 2</em>A recommendation you can trust</div>
    <p>People can see the deal but can’t decide: no reasons, no real cost, no next step.<small>From the insight workshop, my audit, and a view-only first version (+5%)</small></p>
    <p>People open the reasons, and more accept, sooner.</p>
    <p>People read everything and still don’t accept. Then it’s the deal itself, and that’s Habito’s side.</p></div>
  <div class="bet a" style="--d:5"><div class="bet-name"><em>Bet 3</em>The adviser in the app</div>
    <p>People want to ask a human before committing, and leaving Monzo to do it breaks momentum.<small>From customer research</small></p>
    <p>More people talk to their adviser before deciding, and more accept.</p>
    <p>More than 5% of chats land in the wrong place. Agreed up front: roll back.</p></div>
  <div class="bet a" style="--d:6"><div class="bet-name"><em>Bet 4</em>The application in Monzo</div>
    <p>The form loses people because it is long, off-app and typed from scratch.<small>From 2025 funnel data</small></p>
    <p>More people finish each step, and come back after saving.</p>
    <p>More finish the form but accepted recommendations don’t move. Then the form wasn’t the constraint.</p></div>
</div>
<p class="note a" style="--d:7">One business outcome for all four: more accepted recommendations. Each bet also has its own early signal, so we know why the number moves.</p></section>

<script>
(()=>{const b=document.getElementById("fs-toggle");if(!b)return;
const set=()=>{b.textContent=document.fullscreenElement?"Exit full screen":"Full screen ⤢"};
const t=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
b.addEventListener("click",t);document.addEventListener("fullscreenchange",set);
document.addEventListener("keydown",e=>{if((e.key==="f"||e.key==="F")&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!document.querySelector("dialog[open]"))t()});set()})();
</script>
</body>
</html>
