<section class="slide dark was-light" data-n="04" data-k="d1"><div class="eyebrow a mz-kicker">Reach</div><h1 class="a" style="--d:1">Reach people before they’re ready to remortgage</h1><p class="sub a" style="--d:2">While we built towards the vision, we still had revenue targets to hit</p>
<div class="phones-row ctx" style="margin-top:24px;gap:22px">

<section class="slide dark was-light" data-n="06" data-k="bets"><div class="eyebrow a mz-kicker">Habito</div><h1 class="a" style="--d:1">I treated every decision as a bet</h1>
<div class="bets">
  <div class="bets-head a" style="--d:2"><span></span><span>We believed</span><span>We’d know it works if</span><span>I’d change course if</span></div>
  <div class="bet a" style="--d:3"><div class="bet-name"><em>Bet 1</em>Say what it is<small style="display:block;font-weight:500;opacity:.7;margin-top:4px">Shipped in the onboarding</small></div>
    <p>People expect a comparison site, so a broker’s questions feel like a bait-and-switch.<small>From my research: in-house surveys and support conversations</small></p>
    <p>Fewer people leave at the first broker questions, and more reach a recommendation.</p>
    <p>That step doesn’t move. Then the cause is the effort it takes.</p></div>
  <div class="bet a" style="--d:4"><div class="bet-name"><em>Bet 2</em>The application in Monzo</div>
    <p>The form loses people because it is long, off-app and typed from scratch.<small>From 2025 funnel data</small></p>
    <p>More people finish each step, and come back after saving.</p>
    <p>More finish the form but accepted recommendations don’t move. Then the form wasn’t the constraint.</p></div>
  <div class="bet a" style="--d:5"><div class="bet-name"><em>Bet 3</em>A recommendation you can trust</div>
    <p>People can see the deal but can’t decide: no reasons, no real cost, no next step.<small>From the insight workshop, my audit, and a first view-only version</small></p>
    <p>People open the reasons, and more accept, sooner.</p>
    <p>People read everything and still don’t accept. Then it’s the deal itself, and that’s Habito’s side.</p></div>
  <div class="bet a" style="--d:6"><div class="bet-name"><em>Bet 4</em>The adviser in the app</div>
    <p>People want to ask a human before committing, and leaving Monzo to do it breaks momentum.<small>From customer research</small></p>
    <p>More people talk to their adviser before deciding, and more accept.</p>
    <p>More than 5% of chats land in the wrong place. Agreed up front: roll back.</p></div>
</div>
<p class="note a" style="--d:7">Two goals. Bets 1 and 2 help more people get to a recommendation. Bets 3 and 4 help more of them accept it. Accepted recommendations stay the business number for all four.</p></section>
