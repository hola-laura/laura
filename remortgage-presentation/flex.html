    <p class="sub a" style="--d:2">I led design as Flex became a credit card. The new direction landed in five months, then shipped in phases.</p>

<section class="slide dark was-light" data-n="02" data-k="fx_problem">
<div class="eyebrow a mz-kicker">The problem</div><h1 class="a" style="--d:1">By early 2023, Flex was 15% behind its customer goal</h1><p class="sub a" style="--d:2">A hybrid of buy now, pay later and a credit card: a limit, and a plan for every purchase</p>
<div class="split" style="grid-template-columns:1fr 340px;gap:40px;height:auto;margin-top:30px;align-items:start">
  <div class="grid two" style="gap:14px">
    <div class="card navy fx-stat a" style="--d:3;"><div class="label">Customers</div><div class="big">700k</div><p class="fx-stat-p" style="margin:8px 0 0;color:#b8c4cc;font-size:18px">by the end of 2023</p></div>
    <div class="card navy fx-stat a" style="--d:4;"><div class="label">The north star</div><div class="big">£200 → £400</div><p style="margin:8px 0 0;color:#b8c4cc;font-size:18px">average spend per customer, per month</p></div>
    <div class="card navy fx-stat a" style="--d:5;"><div class="label">Active customers</div><div class="big">47% → 60%</div></div>
    <div class="card pink a" style="--d:6;"><div class="label">And underneath</div><p class="strong" style="font-size:22px">Move Flex to Monzo’s new app framework. A full redesign.</p></div>
  </div>

    <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px">
      <div class="card navy fx-stat a" style="--d:3;"><div class="big">65%</div><p style="margin:8px 0 0;color:#b8c4cc;font-size:18px">used credit cards</p></div>
      <div class="card navy fx-stat a" style="--d:4;"><div class="big">9%</div><p style="margin:8px 0 0;color:#b8c4cc;font-size:18px">used buy now, pay later</p></div>
      <div class="card navy fx-stat a" style="--d:5;"><div class="big">71%</div><p style="margin:8px 0 0;color:#b8c4cc;font-size:18px">already knew Flex</p></div>
    </div>
    <p class="note a" style="--d:6">Survey of 1,924 eligible customers who had never tried Flex</p>
    <div class="card mint a" style="--d:6;margin-top:18px"><div class="label">Our hypothesis</div><p class="strong">Positioning Flex as a credit card would bring in more customers.</p></div>

<section class="slide dark was-light" data-n="04" data-k="fx_travel">
<div class="eyebrow a mz-kicker">Reframe the promise</div><h1 class="a" style="--d:1">A travel message got more applications. A credit card message got more customers.</h1>
<div class="split" style="grid-template-columns:1fr 420px;gap:30px;height:auto;margin-top:30px;align-items:start">
  <div class="fx-vs">
    <div class="card navy a" style="--d:3;"><div class="label">Flex for travel</div><h3>More people started</h3><div class="fx-row">Applications<b class="up">+13%</b></div><div class="fx-row">Accounts created<b class="down">−7.7%</b></div></div>
    <div class="card navy a" style="--d:4;"><div class="label">Flex as a credit card</div><h3>More people finished</h3><div class="fx-row">Applications<b class="up">+10.8%</b></div><div class="fx-row">Accounts created<b class="up">+7.1%</b></div></div>
  </div>
  <div class="col" style="gap:14px">
    <div class="card mint a" style="--d:5;"><div class="label">The call</div><p class="strong">We chose credit card. Interest isn’t customers.</p><p>It even worked better with customers we had identified as travellers.</p></div>
    <div class="card lime a" style="--d:6;"><div class="label">Then, a campaign</div><div class="big">+20%</div><p>accounts against our best previous message, sent to 870k customers</p></div>
  </div>
</div>
<p class="note a" style="--d:7">In-app experiments against control: new copy and an intro screen at Flex entry points</p></section>
<section class="slide dark was-light" data-n="05" data-k="fx_audit">
<div class="eyebrow a mz-kicker">Bring the account together</div><h1 class="a" style="--d:1">New words weren’t enough. A credit card has to behave like one.</h1>
<div class="split" style="grid-template-columns:420px 1fr;gap:30px;height:auto;margin-top:30px;align-items:start">
  <div class="col" style="gap:14px">
    <div class="card navy fx-stat a" style="--d:3;"><div class="big">37%</div><p style="margin:8px 0 0;font-size:19px;color:#b8c4cc">of customers had more than 10 active purchases. To change what they paid each month, they opened every purchase, one by one.</p></div>
    <div class="card pink a" style="--d:4;"><div class="label">From the audit</div><p class="strong">“Pay off extra” looked like paying the balance. It paid one purchase.</p></div>
  </div>
  <div class="card navy a" style="--d:5;"><div class="label">20 interviews with our researcher · what people needed</div><ul class="fx-list" style="margin-top:12px"><li><b>1</b><span>See the whole account, not each instalment</span></li><li><b>2</b><span>Pay the balance in one go</span></li><li><b>3</b><span>Change what they pay each month</span></li><li><b>4</b><span>Set a default for card payments<small>Choosing a plan for every coffee was painful</small></span></li><li><b>5</b><span>Later: balance transfers, holds, joint accounts, rewards</span></li></ul></div>
</div></section>
<section class="slide dark was-light" data-n="06" data-k="fx_vision">
<div class="eyebrow a mz-kicker">Bring the account together</div><h1 class="a" style="--d:1">A credit card with full visibility and control</h1><p class="sub a" style="--d:2">The card leads the experience, and you can use it every day</p>
<div class="fx-steps">
  <div class="card navy a" style="--d:3;"><span class="n">01 · VISION</span><h3>One view of the account</h3><p>Played back the research with the team, then shared ideas early to align.</p></div>
  <div class="card navy a" style="--d:4;"><span class="n">02 · I RAN A PRIORITISATION WORKSHOP</span><h3>We couldn’t agree what to build first</h3><p>Scored on vision fit, business impact and effort. 1: the new framework. 2: card defaults. 3: payments.</p></div>
  <div class="card pink a" style="--d:5;"><span class="n">03 · FIRST TEST</span><h3>Structure clear, payments confusing</h3><p>The screen tried to do too much. I took out what we wouldn’t build yet, like insights and rewards.</p></div>
  <div class="card mint a" style="--d:6;"><span class="n">04 · SECOND TEST</span><div class="big" style="margin:8px 0 6px">9/10</div><p>completed the payment tasks without help, in a task-based usability test.</p></div>
</div></section>
<section class="slide dark was-light" data-n="07" data-k="fx_account">
<div class="split" style="grid-template-columns:1fr 600px;gap:40px;align-items:center">
  <div>
    <div class="eyebrow a mz-kicker">What we launched</div><h1 class="a" style="--d:1">One balance. A clearer starting point.</h1>
    <div class="card navy a" style="--d:3;margin-top:26px"><div class="label">Research decided what went where</div><ul class="fx-list" style="margin-top:12px"><li><b>1</b><span>Balance, left to spend and next payment</span></li><li><b>2</b><span>Pay early, pay extra or clear it all</span></li><li><b>3</b><span>Recent purchases<small>Each breakdown moved to a second screen</small></span></li><li><b>4</b><span>How much of the limit is used<small>For people watching their credit score</small></span></li></ul></div>
    <div class="card lime a" style="--d:4;margin-top:14px"><div class="label">A push that paid off</div><p class="strong">I convinced the team to ship limit utilisation in v1: 26% more people asked for a higher limit.</p></div>
  </div>

    <div class="a" style="--d:5"><div class="bz " style="width:270px"><span class="bz-screen bz-393"><img src="../assets/flex/v2/home.webp" alt="" loading="lazy"></span></div><p class="fx-cap"><b>Monzo home</b> · the card leads</p></div>
  </div>
</div></section>
<section class="slide dark was-light" data-n="08" data-k="fx_repay">
<div class="eyebrow a mz-kicker">Make repayments understandable</div><h1 class="a" style="--d:1">In credit, less friction isn’t always better.</h1>
<div class="split" style="grid-template-columns:1fr 760px;gap:30px;height:auto;margin-top:26px;align-items:start">
  <div class="col" style="gap:14px">
    <div class="card navy a" style="--d:3;"><div class="label">Pay the balance</div><p class="strong">See what’s left and the interest you save.</p></div>
    <div class="card pink a" style="--d:4;"><div class="label">A useful pause</div><p class="strong">An extra payment doesn’t always lower the next one. The flow says so first.</p></div>
    <div class="card mint a" style="--d:5;"><div class="label">Shipped later, on purpose</div><p class="strong">Editing the monthly amount needed a new allocation algorithm. The clearer account went first.</p></div>
  </div>
  <div class="fx-phones">
    <div class="a" style="--d:4"><div class="bz " style="--d:4;width:230px"><span class="bz-screen bz-393"><img src="../assets/flex/v2/extra-sheet.webp" alt="" loading="lazy"></span></div><p class="fx-cap"><b>Pay extra</b> · the pause</p></div>
    <div class="a" style="--d:5"><div class="bz " style="--d:5;width:230px"><span class="bz-screen bz-393"><img src="../assets/flex/v2/extra-paid.webp" alt="" loading="lazy"></span></div><p class="fx-cap"><b>Done</b> · one step closer</p></div>
    <div class="a" style="--d:6"><div class="bz " style="--d:6;width:230px"><span class="bz-screen bz-393"><img src="../assets/flex/v2/edit-c.webp" alt="" loading="lazy"></span></div><p class="fx-cap"><b>Monthly payment</b> · see the effect</p></div>
  </div>
</div></section>
<section class="slide dark was-light" data-n="09" data-k="fx_defaults">
<div class="split" style="grid-template-columns:1fr 560px;gap:40px;align-items:center">
  <div>
    <div class="eyebrow a mz-kicker">Make repayments understandable</div><h1 class="a" style="--d:1">Choose once, not for every coffee</h1><p class="sub a" style="--d:2">Card defaults: pay in full, the minimum, or still choose every time</p>
    <div class="card navy fx-call a" style="--d:3;margin-top:26px"><b>Situation</b>“Pay in full” first looked like the kindest default: no interest. But failed payments went up.<b>My call</b>Stop it, and test “Choose for every purchase” first.<b>Result</b>Failed payments barely changed, and people kept the decision.</div>
    <p class="note a" style="--d:5">Pay in 3 or 6 couldn’t be a default: it was a revenue risk</p>
  </div>
  <div class="fx-phones">
    <div class="a" style="--d:4"><div class="bz " style="--d:4;width:300px"><span class="bz-screen bz-393"><img src="../assets/flex/v2/plan-ready-full.webp" alt="" loading="lazy"></span></div><p class="fx-cap"><b>Default set</b> · pay in full on your payment date</p></div>
  </div>
</div></section>
<section class="slide dark was-light" data-n="10" data-k="fx_states">

<div class="fx-phones" style="margin-top:34px;gap:18px">
  <div class="a" style="--d:3"><div class="bz " style="--d:3;width:220px"><span class="bz-screen bz-393"><img src="../assets/flex/v2/s-new.webp" alt="" loading="lazy"></span></div><p class="fx-cap"><b>Not used yet</b></p></div>

</div></section>
<section class="slide dark was-light" data-n="11" data-k="fx_results">
<div class="eyebrow a mz-kicker">Results</div><h1 class="a" style="--d:1">A credit card that won awards</h1>

  </div>
  <div class="col" style="gap:12px">
    <video class="a fx-vid" style="--d:4;width:420px;height:280px" src="../assets/flex/campaign/flex-award-bba.mp4" poster="../assets/flex/campaign/flex-award-bba-poster.webp" autoplay muted loop playsinline aria-hidden="true"></video>
    <div class="a" style="--d:6"><div class="fx-award"><b>2023</b>Best Credit Card Provider · British Bank Awards</div><div class="fx-award"><b>2024</b>Best Credit Card · Card &amp; Payments Awards</div><div class="fx-award"><b>2025</b>1M+ customers · Monzo annual report</div></div>
  </div>

<section class="slide dark was-light" data-n="12" data-k="fx_learn">
<div class="eyebrow a mz-kicker">Looking back</div><h1 class="a" style="--d:1">What I learned</h1>
<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px">
  <div class="card navy a" style="--d:3;"><div class="qnum">01</div><h3>Interest isn’t customers</h3><p>Measure who finishes, not who starts. Travel won the clicks and lost the accounts.</p></div>
  <div class="card navy a" style="--d:4;"><div class="qnum">02</div><h3>In credit, friction can be care</h3><p>The pause before an extra payment saves people from a surprise.</p></div>
  <div class="card mint a" style="--d:5;"><div class="qnum">03</div><h3>Bring risk in on day one</h3><p>Our hardest calls weren’t only design. Next time, business and risk join the first workshop, and success means people staying on top of payments.</p></div>
</div>
<p class="note a" style="--d:6">What came next: money transfers, and limit changes that never feel like a surprise</p></section>
<section class="slide dark" data-n="13" data-k="fx_qa">
