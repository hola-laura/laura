<section class="slide dark was-light" data-n="08" data-k="plan"><div class="eyebrow a mz-kicker">The vision</div><h1 class="a" style="--d:1">I turned the vision into bets the team could ship</h1>
<div class="road road2"><div class="road-col a" style="--d:3"><div class="road-art"><img src="assets/img/spot-checklist.png" alt=""></div><div class="road-body"><span class="road-step">Now</span><p class="road-sub">What we could start straight away</p><ul class="road-list"><li>Onboarding to the broker</li><li>A progress tracker closer to real time</li><li>Pre-fill with data we already hold</li></ul></div></div><i class="road-arrow a" style="--d:4"></i><div class="road-col a" style="--d:4"><div class="road-art"><img src="assets/img/spot-form.png" alt=""></div><div class="road-body"><span class="road-step">Next</span><p class="road-sub">What needed more work</p><ul class="road-list"><li>Open the door to people without a connected mortgage</li><li>Our own application form</li><li>Estimated deals</li><li>Recommendations in Monzo, view only</li></ul></div></div><i class="road-arrow a" style="--d:5"></i><div class="road-col a" style="--d:5"><div class="road-art"><img src="assets/img/spot-support.png" alt=""></div><div class="road-body"><span class="road-step">Later</span><p class="road-sub">The big things</p><ul class="road-list"><li>Recommendations in Monzo, you can accept them</li><li>Adviser chat in the app*</li><li>Document upload*</li></ul></div></div></div><p class="note a road-foot" style="--d:7">* Moved back again later in 2026: we needed to grow faster, so the focus moved to first-time buyers.</p></section>

<section class="slide dark was-light" data-n="15" data-k="bets"><div class="eyebrow a mz-kicker">Habito</div><h1 class="a" style="--d:1">I treated every decision as a bet</h1>
<div class="bets">
  <div class="bets-head a" style="--d:2"><span></span><span>We believed</span><span>We’d know it works if</span><span>I’d change course if</span></div>
  <div class="bet a" style="--d:3"><div class="bet-name"><em>Bet 1</em>Say what it is</div>
    <p>People expect a comparison site, so a broker’s questions feel like a bait-and-switch.<small>From my research: in-house surveys and support conversations</small></p>
    <p>Fewer people leave at the first broker questions, and more reach a recommendation.</p>
    <p>That step doesn’t move. Then the cause is the effort it takes.</p></div>
  <div class="bet a" style="--d:4"><div class="bet-name"><em>Bet 2</em>The application in Monzo</div>
    <p>The form loses people because it is long, off-app and typed from scratch.<small>From 2025 funnel data</small></p>
    <p>More people finish each step, and come back after saving.</p>
    <p>More finish the form but accepted recommendations don’t move. Then the form wasn’t the constraint.</p></div>
  <div class="bet a" style="--d:5"><div class="bet-name"><em>Bet 3</em>A recommendation you can trust</div>
    <p>People can see the deal but can’t decide: no reasons, no real cost, no next step.<small>From the insight workshop, my audit, and a first view-only version</small></p>
    <p>People open the reasons, and more accept, sooner.</p>
    <p>People read everything and still don’t accept. Then it’s the deal itself, and that’s Habito’s side.</p></div>
  <div class="bet a" style="--d:6"><div class="bet-name"><em>Bet 4</em>The adviser in the app</div>
    <p>People want to ask a human before committing, and leaving Monzo to do it breaks momentum.<small>From customer research</small></p>
    <p>More people talk to their adviser before deciding, and more accept.</p>
    <p>More than 5% of chats land in the wrong place. Agreed up front: roll back.</p></div>
</div>
<p class="note a" style="--d:7">Two goals. Bets 1 and 2 help more people get to a recommendation. Bets 3 and 4 help more of them accept it. Accepted recommendations stay the business number for all four.</p></section>

<section class="slide dark was-light" data-n="33" data-k="fv2"><div class="eyebrow a mz-kicker">Appendix<span class="mz-pill">Focus View proposal</span></div><h1 class="a" style="--d:1">Four decisions, and why I made them</h1>

  <div class="round a" style="--d:3"><em>Returning, not connected</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/fvd-02.png" alt=""></span></span><h3>Value without connecting</h3><p>If you only looked at rates, your saved rates come first. The earlier visit counts.</p></div>
  <div class="round a" style="--d:4"><em>Deal ends in 4 months</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/fvd-07.png" alt=""></span></span><h3>Make the cost concrete</h3><p>£926 a month now, £1,358 if you do nothing.</p></div>
  <div class="round a" style="--d:5"><em>Remortgaging</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/fvd-08.png" alt=""></span></span><h3>The tracker lives at home</h3><p>Your progress sits on the home screen.</p></div>
  <div class="round a" style="--d:6"><em>Data unavailable</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/fvd-10.png" alt=""></span></span><h3>Never a dead end</h3><p>If the data fails, show the last known numbers, with a date.</p></div>
</div>
<p class="note a" style="--d:7">Resolved every time the screen opens: connected? → remortgaging? → months until the deal ends.</p></section>
<section class="slide dark was-light" data-n="34" data-k="multi"><div class="eyebrow a mz-kicker">Appendix<span class="mz-pill">UX Days 2026</span></div><h1 class="a" style="--d:1">Four ways to show two mortgages on one home</h1>
<div class="rounds five">
  <div class="round a" style="--d:3"><em>A · Property overview</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/mm-a.png" alt=""></span></span></div>
  <div class="round a" style="--d:4"><em>B · Stacked sections</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/mm-b.png" alt=""></span></span></div>
  <div class="round a" style="--d:5"><em>C · Switcher</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/mm-c.png" alt=""></span></span></div>
  <div class="round a" style="--d:6"><em>D · Combine into one deal</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/mm-d.png" alt=""></span></span></div>
  <div class="a" style="--d:7;display:flex;flex-direction:column;gap:14px">
    <div class="card  a" style="--d:7;"><div class="label">The problem</div><p>The tools were built for one person with one mortgage. Two mortgages, or a couple, saw confusing or different numbers.</p></div>
    <div class="card navy a" style="--d:8;"><div class="label">The insight</div><p class="strong">Show the property first, then its mortgages.</p><p>The data already adds up at property level. The screen didn’t.</p></div>
    <div class="card mint a" style="--d:9;"><div class="label">Where I’d start</div><p>The cheapest fix: both mortgages are already there, they just render badly.</p></div>
  </div>
</div></section>
<section class="slide dark" data-n="35" data-k="openfin"><div class="eyebrow a mz-kicker">Appendix<span class="mz-pill">Open Finance concept</span></div><h1 class="a" style="--d:1">Next: mortgage data straight from the lender</h1>
