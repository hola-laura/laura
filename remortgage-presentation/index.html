<section class="slide dark was-light" data-n="06" data-k="research"><div class="eyebrow a mz-kicker">The reset</div><h1 class="a" style="--d:1">Customers asked us for four things</h1>

<div class="fgrid fgrid4"><div class="fcard a" style="--d:3"><i>01</i><h3>“Don’t send me out.”</h3><p>They expected to <mark>get the new deal inside Monzo</mark>.</p><div class="fviz"><img class="spot" src="assets/img/spot-app.png" alt=""><div class="fviz-r"><span class="chip dark">Monzo</span><span class="farrow"></span><span class="chip ghost">Better’s site</span></div></div></div><div class="fcard a" style="--d:4"><i>02</i><h3>“Use what you know.”</h3><p><mark>Reuse the data Monzo already holds</mark>, instead of asking again.</p><div class="fviz"><img class="spot" src="assets/img/spot-form.png" alt=""><div class="fviz-r"><span class="chip ok">Income</span><span class="chip ok">Mortgage balance</span><span class="chip ok">Address</span></div></div></div><div class="fcard a" style="--d:5"><i>03</i><h3>“Let me choose.”</h3><p>Some wanted a call, because it made them feel safe. Others preferred <mark>less intrusive ways, at a time they chose</mark>.</p><div class="fviz"><img class="spot" src="assets/img/spot-chat.png" alt=""><div class="fviz-r"><span class="chip">Chat</span><span class="chip">Phone</span><span class="chip">Email</span></div></div></div><div class="fcard a" style="--d:6"><i>04</i><h3>“Tell me what’s happening.”</h3><p><mark>The wait</mark> was the most stressful part.</p><div class="fviz"><img class="spot" src="assets/img/spot-bell.png" alt=""><div class="fviz-r"><span class="push"><em>M</em><span><b>Monzo</b> Your application has moved to the next step</span></span></div></div></div></div></section>

<section class="slide dark was-light" data-n="10" data-k="honb"><div class="eyebrow a mz-kicker">Habito</div><h1 class="a" style="--d:1">I designed the onboarding to Habito</h1><style>.bz-screen .ir-wrap{display:block;position:relative}.slide.active .bz-screen .ir-wrap{animation:irScroll 16s ease-in-out 1.4s infinite}@media (prefers-reduced-motion:reduce){.slide.active .bz-screen .ir-wrap{animation:none}}</style><div class="honb"><div class="role-ph a" style="--d:3"><div class="bz" style="width:250px"><span class="bz-screen"><span class="ir-wrap" style="--t:-44.6%"><img src="assets/img/honb-1.webp?v=9" alt="Find a mortgage with free expert help: Monzo introduces you to Habito, with how we’ll help and what’s good to know"><img class="bz-anim" src="assets/anim/house-light.webp" alt="" aria-hidden="true" style="left:19.17%;top:7.006%;width:66.67%"></span></span></div><p><b>Value proposition</b> · the first page</p></div><div class="role-ph a" style="--d:4"><div class="bz" style="width:250px"><span class="bz-screen"><img src="assets/img/honb-2.webp?v=7" alt="Habito by Monzo: let’s set up your account with the email Monzo already has, then continue"></span></div><p><b>Your Habito account</b> · check it in the app or on the web</p></div><div class="role-ph a" style="--d:5"><div class="bz" style="width:250px"><span class="bz-screen"><img src="assets/img/honb-3.webp?v=7" alt="Are you remortgaging with someone else? By myself, or with someone else"></span></div><p><b>Someone else?</b> · add a second applicant</p></div><div class="role-ph a" style="--d:6"><div class="bz" style="width:250px"><span class="bz-screen"><img src="assets/img/honb-4.webp?v=7" alt="You’re all set: we’ll now take you to Habito to fill in a few details"></span></div><p><b>You’re all set</b> · then on to Habito</p></div></div><div class="a" style="--d:7;display:flex;justify-content:center;gap:12px;margin-top:18px"><button type="button" class="fig-link ghost fb-btn" data-pop="honb-learning" style="margin-top:0">Learning 1 · people thought we were a comparison site</button><button type="button" class="fig-link ghost fb-btn" data-pop="honb-learning2" style="margin-top:0">Learning 2 · people didn’t want to leave Monzo</button></div><dialog class="fb-pop cmp-pop" id="honb-learning" aria-label="Learning 1: people thought we were a comparison site"><div class="fb-head"><div><p class="fb-kicker">Learning 1 · people thought we were a comparison site</p><p class="fb-sub">We led with “100+ lenders”, so a broker’s questions felt like a bait-and-switch. I led with expert help instead. Live since 1 May 2026; Ops heard fewer questions about comparing deals.</p></div><button type="button" class="fb-close" aria-label="Close">×</button></div><div class="cmp"><figure><img src="assets/img/d1-before.webp?v=1" alt="Before: Compare remortgage deals with Habito" style="aspect-ratio:402/874;object-fit:cover;object-position:top;height:62vh"><figcaption>Before · “Compare remortgage deals from 100+ lenders”</figcaption></figure><figure><img src="assets/img/day1-broker.webp?v=3" alt="After: Find a mortgage with free expert help" style="aspect-ratio:402/874;object-fit:cover;object-position:top;height:62vh"><figcaption>After · “Find a mortgage with free expert help”</figcaption></figure></div></dialog><style>.l2{display:flex;align-items:center;justify-content:center;gap:18px;padding:4px 28px 28px}.l2 figure{margin:0;display:grid;gap:10px;justify-items:center}.l2 figcaption{font-size:15px;font-weight:600;color:var(--mz-soft);text-align:center}.l2 figcaption b{color:#fff;font-weight:700}.fb-pop .l2 img{width:auto;margin:0;background:none}.fb-pop .l2 .ph{height:54vh;aspect-ratio:402/874;object-fit:cover;object-position:top;border-radius:22px}.fb-pop .l2 .lap{height:auto;width:min(430px,34vw);border-radius:0}.l2-arrow{font-size:28px;color:var(--mz-soft);font-weight:300}.l2-two{display:grid;gap:12px;justify-items:center;padding:18px 20px 16px;border-radius:22px;background:rgba(255,255,255,.05)}.l2-two>p{margin:0;font-size:15px;font-weight:700;color:#fff}.l2-two>div{display:flex;align-items:center;gap:20px}</style><dialog class="fb-pop cmp-pop" id="honb-learning2" aria-label="Learning 2: people didn’t want to leave Monzo" style="width:min(1180px,96vw)"><div class="fb-head"><div><p class="fb-kicker">Learning 2 · people didn’t want to leave Monzo</p><p class="fb-sub">We couldn’t avoid sending them to Habito yet. So we framed the account as a benefit: set it up once, then check your progress wherever suits you.</p></div><button type="button" class="fb-close" aria-label="Close">×</button></div><div class="l2"><figure><span style="position:relative;display:inline-block;line-height:0"><img class="ph" src="assets/img/honb-2.webp?v=7" alt="Let’s set up your account: we’ll use your email to set up your Habito account. You can then check your progress here or on Habito’s website"><i aria-hidden="true" style="position:absolute;left:5%;top:36.8%;width:90%;height:9.4%;border:2px solid var(--mz-coral);border-radius:10px;background:rgba(255,77,64,.07)"></i></span><figcaption><b>One account</b> · the benefit, said up front</figcaption></figure><span class="l2-arrow" aria-hidden="true">→</span><div class="l2-two"><p>Check your progress in two places</p><div><figure><img class="ph" style="height:44vh" src="assets/img/trk1-1.webp?v=1" alt="Your progress in the Monzo app: chat with your mortgage expert, then the steps of your remortgage"><figcaption><b>In the Monzo app</b></figcaption></figure><figure><img class="lap" src="assets/img/habito-by-monzo-laptop.png" alt="Habito by Monzo website: your mortgage, in progress"><figcaption><b>Or on Habito’s website</b></figcaption></figure></div></div></div></dialog></section>
<section class="slide dark was-light" data-n="11" data-k="walk">
<div class="split" style="grid-template-columns:1fr 600px">
  <div>
    <div class="eyebrow a mz-kicker">Habito</div><h1 class="a" style="--d:1">No design files at Habito, so I became the customer</h1>
    <div class="card pink a" style="--d:3;margin-top:26px"><div class="label">Constraint</div><p class="strong">Habito had no design team and no design files. The only way to see their journey was to go through it myself.</p></div>

<section class="slide dark was-light" data-n="15" data-k="bets"><div class="eyebrow a mz-kicker">Habito</div><h1 class="a" style="--d:1">I treated every decision as a bet</h1>
<div class="bets">
  <div class="bets-head a" style="--d:2"><span></span><span>We believed</span><span>We’d know it works if</span><span>I’d change course if</span></div>
  <div class="bet a" style="--d:3"><div class="bet-name"><em>Bet 1</em>Say what it is<small style="display:block;font-weight:500;opacity:.7;margin-top:4px">Shipped in the onboarding</small></div>
    <p>People expect a comparison site, so a broker’s questions feel like a bait-and-switch.<small>From my research: in-house surveys and support conversations</small></p>
    <p>Fewer people leave at the first broker questions, and more reach a recommendation.</p>
    <p>That step doesn’t move. Then the cause is the effort it takes.</p></div>
  <div class="bet a" style="--d:4"><div class="bet-name"><em>Bet 2</em>The application in Monzo</div>
    <p>The form loses people because it is long, off-app and typed from scratch.<small>From 2025 funnel data</small></p>
    <p>More people finish each step, and come back after saving.</p>
    <p>More finish the form but accepted recommendations don’t move. Then the form wasn’t the constraint.</p></div>
  <div class="bet a" style="--d:5"><div class="bet-name"><em>Bet 3</em>A recommendation you can trust</div>
    <p>People can see the deal but can’t decide: no reasons, no real cost, no next step.<small>From the insight workshop, my audit, and a first view-only version</small></p>
    <p>People open the reasons, and more accept, sooner.</p>
    <p>People read everything and still don’t accept. Then it’s the deal itself, and that’s Habito’s side.</p></div>
  <div class="bet a" style="--d:6"><div class="bet-name"><em>Bet 4</em>The adviser in the app</div>
    <p>People want to ask a human before committing, and leaving Monzo to do it breaks momentum.<small>From customer research</small></p>
    <p>More people talk to their adviser before deciding, and more accept.</p>
    <p>More than 5% of chats land in the wrong place. Agreed up front: roll back.</p></div>
</div>
<p class="note a" style="--d:7">Two goals. Bets 1 and 2 help more people get to a recommendation. Bets 3 and 4 help more of them accept it. Accepted recommendations stay the business number for all four.</p></section>

    <ul class="design-points"><li class="a" style="--d:3"><b>It changes with the state you’re in.</b> What you see depends on where you are in your mortgage.</li><li class="a" style="--d:4"><b>One primary action per state.</b> Instead of four generic tool cards.</li><li class="a" style="--d:5"><b>Calm, then urgent.</b> The tone shifts as your deal end gets closer.</li></ul>
    <div class="design-status a" style="--d:7">Proposal · for the 600k connected and the millions not connected · to validate before rebuilding</div><a class="fig-link small-link a" style="--d:8" href="https://www.figma.com/design/sBL0QwAN98Bi9CoNKMuup1/Focus-View-proposal?node-id=0-1" target="_blank" rel="noopener">Open the Figma file ↗</a>
  </div>
  <div class="design-stage a" style="--d:2"><iframe data-src="proto/flow.html?mz=4&f=focus&v=7" title="The home screen, in eleven states — animated prototype" style="width:860px" allowtransparency="true"></iframe></div>
</div></section>
<section class="slide dark was-light" data-n="33" data-k="fv2"><div class="eyebrow a mz-kicker">Appendix<span class="mz-pill">Focus View proposal</span></div><h1 class="a" style="--d:1">Four decisions, and why I made them</h1>
<div class="rounds">
  <div class="round a" style="--d:3"><em>Returning, not connected</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/fvd-02.png?v=2" alt=""></span></span><h3>Value without connecting</h3><p>If you only looked at rates, your saved rates come first. The earlier visit counts.</p></div>
  <div class="round a" style="--d:4"><em>Deal ends in 4 months</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/fvd-07.png?v=2" alt=""></span></span><h3>Make the cost concrete</h3><p>£926 a month now, £1,358 if you do nothing.</p></div>
  <div class="round a" style="--d:5"><em>Remortgaging</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/fvd-08.png?v=2" alt=""></span></span><h3>The tracker lives at home</h3><p>Your progress sits on the home screen.</p></div>
  <div class="round a" style="--d:6"><em>Data unavailable</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/fvd-10.png?v=2" alt=""></span></span><h3>Never a dead end</h3><p>If the data fails, show the last known numbers, with a date.</p></div>
</div>
<p class="note a" style="--d:7">Resolved every time the screen opens: connected? → remortgaging? → months until the deal ends.</p></section>
<section class="slide dark was-light" data-n="34" data-k="multi"><div class="eyebrow a mz-kicker">Appendix<span class="mz-pill">UX Days 2026</span></div><h1 class="a" style="--d:1">Four ways to show two mortgages on one home</h1>
<div class="rounds five">
  <div class="round a" style="--d:3"><em>A · Property overview</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/mm-a.png?v=2" alt=""></span></span></div>
  <div class="round a" style="--d:4"><em>B · Stacked sections</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/mm-b.png?v=2" alt=""></span></span></div>
  <div class="round a" style="--d:5"><em>C · Switcher</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/mm-c.png?v=2" alt=""></span></span></div>
  <div class="round a" style="--d:6"><em>D · Combine into one deal</em><span class="bz" style="width:175px;padding:4.5px;border-radius:26px"><span class="bz-screen" style="border-radius:21px"><img src="assets/proto/mm-d.png?v=2" alt=""></span></span></div>
  <div class="a" style="--d:7;display:flex;flex-direction:column;gap:14px">
    <div class="card  a" style="--d:7;"><div class="label">The problem</div><p>The tools were built for one person with one mortgage. Two mortgages, or a couple, saw confusing or different numbers.</p></div>
    <div class="card navy a" style="--d:8;"><div class="label">The insight</div><p class="strong">Show the property first, then its mortgages.</p><p>The data already adds up at property level. The screen didn’t.</p></div>
    <div class="card mint a" style="--d:9;"><div class="label">Where I’d start</div><p>The cheapest fix: both mortgages are already there, they just render badly.</p></div>
  </div>
</div></section>
<section class="slide dark" data-n="35" data-k="openfin"><div class="eyebrow a mz-kicker">Appendix<span class="mz-pill">Open Finance concept</span></div><h1 class="a" style="--d:1">Next: mortgage data straight from the lender</h1>
<div class="pan a" style="--d:2"><img src="assets/img/openfinance-strip.jpg" alt="Open Finance concept screens"></div>
<div class="grid three" style="margin-top:22px">
  <div class="card  a" style="--d:3;"><div class="label">Connect</div><p>Through Open Banking, with consent you control: you choose the accounts and renew every 90 days.</p></div>
  <div class="card  a" style="--d:4;"><div class="label">Advice before you ask</div><p>“You’ll reach the next loan-to-value band before your deal ends.” “Overpaying beats your savings pot.”</p></div>
  <div class="card mint a" style="--d:5;"><div class="label">The real cost of switching</div><p>“Switching now would cost £2,900 in early repayment charges.” Shared with the FCA as part of Monzo’s Open Finance work.</p></div>
</div></section>
