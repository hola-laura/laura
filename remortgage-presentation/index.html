<section class="slide light" data-n="9"><div class="eyebrow a">Decision 1 · Reach · 2025–early 2026</div><h1 class="a" style="--d:1">Reach people before they’re ready to remortgage</h1>
<div class="grid" style="grid-template-columns:1fr 1fr 400px;margin-top:30px;align-items:stretch">
  <div class="col">
    <div class="card  a" style="--d:3;"><div class="label">Problem</div><p class="strong">Only customers with a connected mortgage and a known deal end could enter. Most were invisible to us.</p></div>
    <div class="card pink a" style="--d:5;"><div class="label">Trade-off</div><p>Indicative rates are regulated: every word checked, without slowing experiments down.</p></div>
    <div class="card mint a" style="--d:6;"><div class="label">Result</div><p class="result"><span class="count" data-to="75" data-prefix="~" data-suffix="%">~75%</span> above the referral goal · team result</p></div>
  </div>
  <div class="card navy a" style="--d:4;"><div class="label">What I decided</div><ul><li>“Add your deal end” without a connected mortgage</li><li>Indicative rates and estimated deals</li><li>Focus View: home changes with your moment</li><li>Homeownership moved into the Grow tab</li><li>An experiment file linking every design to its data</li></ul></div>
  <div class="col center"><img class="phone a float" style="width:240px;--d:7" src="https://images.ctfassets.net/ro61k101ee59/11yeERGYbXI7xjH38asZ9L/555706448adfcacac521a5d2a87cc975/Frame__17_.avif?w=700&fm=webp&q=80" alt=""><a class="fig-link a" style="--d:8" href="https://www.figma.com/design/NwhbipMQweUXoMUHMmp8y8/Better.co.uk-experiments--Copy-?node-id=0-1&t=YT4ojF8qBhr7goSK-1" target="_blank" rel="noopener">See the experiments ↗</a><a class="fig-link a" style="--d:9;margin-top:10px" href="https://www.figma.com/design/vYurN7sfZ4L5LvqTpkaTpy/Homeownership-Master-file?node-id=8571-128380&t=kHX24gDhcGquarU5-1" target="_blank" rel="noopener">Focus View and entry points ↗</a></div>
</div><div class="foot"><span>Monzo Homeownership · design case study</span><span>09 / 19</span></div></section>

<section class="slide light" data-n="11"><div class="eyebrow a">Decision 2 · Habito’s Day 1 · 2026</div><h1 class="a" style="--d:1">Tell people what this actually is</h1>
<div class="grid" style="grid-template-columns:1fr 1fr 300px;margin-top:30px">
  <div class="col">
    <div class="card  a" style="--d:3;"><div class="label">Problem</div><p class="strong">People thought it was a comparison tool. When a broker asked about their finances, it felt like a bait-and-switch.</p></div>
    <div class="card coral a reframe" style="--d:4"><div class="old">Compare mortgages</div><div class="new">Get a mortgage with a broker</div><span class="launched">Launched 1 May 2026</span></div>
    <div class="card pink a" style="--d:6;"><div class="label">Trade-off</div><p>Stopped the pre-fill experiment early and turned it on for everyone to make Day 1. Speed over learning, on purpose.</p></div>
  </div>
  <div class="card navy a" style="--d:5;"><div class="label">What I decided</div><ul><li>Reframe as a broker, not a comparison site</li><li>Lighter consent, commission disclosure kept</li><li>Trust signals early</li><li>A clear “what happens next”</li><li>Account creation framed as a benefit</li><li>Pre-fill on for everyone</li></ul></div>
  <div class="col center"><img class="phone a float" style="width:280px;--d:7" src="https://images.ctfassets.net/ro61k101ee59/682Rj0ZDs9i7WyIFltWqxE/a978c870cd6757850bf88532f4fc6f1a/Get_fee_free_remortgage_advice.avif?w=700&fm=webp&q=80" alt=""><p class="note center">Habito by Monzo, in the app today</p></div>
</div><div class="foot"><span>Monzo Homeownership · design case study</span><span>11 / 19</span></div></section>

<section class="slide light" data-n="13"><div class="eyebrow a">Decision 4 · Adviser chat · 2026</div><h1 class="a" style="--d:1">Bring the adviser into the app — fast, with guardrails</h1>

  <div class="card pink a" style="--d:5;"><div class="label">The risk</div><p class="strong">A second chat in Monzo: people ask their adviser about a blocked card, or Monzo support about their mortgage.</p></div>
</div>
<div class="grid" style="grid-template-columns:1fr 1fr 1fr 300px;margin-top:20px">

<section class="slide light" data-n="14"><div class="eyebrow a">Decision 5 · The application · 2026</div><h1 class="a" style="--d:1">Move the application into Monzo, pre-filled</h1>
<div class="grid" style="grid-template-columns:1fr 1fr 400px;margin-top:30px;align-items:stretch">
  <div class="col">
    <div class="card  a" style="--d:3;"><div class="label">Problem</div><p class="strong">The application lived on Habito’s website, outside Monzo, and it was long: in 2025 almost half of people dropped out there. Two thirds were applying with a partner.</p></div>
    <div class="card pink a" style="--d:5;"><div class="label">Trade-off</div><p>We wanted your partner to join and fill in their part, but Habito’s operations allow only one account per application. Still an open topic.</p></div>
    <div class="card mint a" style="--d:6;"><div class="label">Status</div><p class="result">In test · too early to claim an uplift</p></div>
  </div>
  <div class="card navy a" style="--d:4;"><div class="label">What I decided</div><ul><li>The application inside Monzo, not on a partner site</li><li>Pre-filled: you confirm what Monzo already knows instead of typing it</li><li>Save it and come back later</li><li>Instrumented step by step to see where people stop</li><li>Next: voice, and Open Banking to bring in data from other banks, shown to the FCA as part of our Open Finance vision</li></ul></div>
  <div class="col center"><div class="gif a" style="background:#112231;height:270px"><img src="assets/anim/pencil-paper.gif" alt="" style="width:380px"></div><a class="fig-link a" style="--d:8" href="https://www.figma.com/design/XWHwXNdVjU4EdBf8xnQsZC/open-finance-vision?node-id=5047-39361&t=CbIbTMZ8surcEIg6-1" target="_blank" rel="noopener">See the Open Finance vision ↗</a></div>
</div><div class="foot"><span>Monzo Homeownership · design case study</span><span>14 / 19</span></div></section>
<section class="slide light" data-n="15"><div class="eyebrow a">AI in how I work</div><h1 class="a" style="--d:1">I built a tool to get regulated designs approved faster</h1>
<div class="grid" style="grid-template-columns:360px 1fr 400px;margin-top:30px">
  <div class="col">
    <div class="card pink a" style="--d:3;"><div class="label">Problem</div><p class="strong">Every screen about rates, deals or recommendations went back and forth with Compliance.</p></div>
    <div class="gif a" style="background:#112231;height:220px"><img src="assets/anim/padlocks.gif" alt="" style="width:340px"></div>
  </div>
  <div class="card navy a" style="--d:4;"><div class="label">The checker · used inside Monzo</div><ul><li>Teams upload their own rules</li><li>Paste copy or drop in Figma screens</li><li>It flags lines that may break a rule and drafts a fix</li><li>Missing information, like the APRC, is flagged, never invented</li><li>Loans, Overdrafts and Wealth asked for access</li></ul><div class="demo-pill">Live demo · a copy rebuilt for this case study, no Monzo data</div></div>
  <div class="card mint a" style="--d:5;"><div class="label">Also</div><ul><li>AI analysis of support conversations: why customers disconnected their mortgage</li><li>Layout variations and quick prototypes, once research set the direction</li></ul><p class="small" style="margin-top:14px">It flags risk. Compliance still approves.</p></div>
</div><div class="foot"><span>Monzo Homeownership · design case study</span><span>15 / 19</span></div></section>

<section class="slide light" data-n="17"><div class="eyebrow a">What I learned</div><h1 class="a" style="--d:1">What I’d take to the next problem</h1>
<div class="grid four" style="margin-top:40px">
  <div class="card coral a" style="--d:3;"><div class="qnum">01</div><h3>Growth at the top isn’t growth</h3><p>Design the middle of the funnel as carefully as the entry point</p></div>
  <div class="card  a" style="--d:4;"><div class="qnum">02</div><h3>The integration is part of the design</h3><p>Routing, consent and who-you’re-talking-to are UX, not plumbing</p></div>
