<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14252b">
<meta name="description" content="A visual case study on evolving Monzo Homeownership and the remortgage experience.">
<title>Remortgaging — Case study presentation | Laura Sampedro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="slides.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="identity"><span class="monogram" aria-hidden="true">LS</span><div><strong>Laura Sampedro</strong><span>Product design · Case study</span></div></div>
  <div class="deck-label"><span class="eyebrow">MONZO · HOMEOWNERSHIP</span><span class="divider" aria-hidden="true"></span><span id="slide-count" aria-live="polite">01 / 19</span></div>
  <button class="notes-trigger" id="open-notes" type="button" aria-haspopup="dialog" aria-controls="notes-sheet"><span class="notes-icon" aria-hidden="true">▤</span><span>Speaker notes</span></button>
</header>
<main class="presentation" aria-label="Case study presentation">
  <div class="stage">
    <button class="arrow arrow-prev" id="previous-slide" type="button" aria-label="Previous slide"><span aria-hidden="true">←</span></button>
    <figure class="slide-figure">
      <img id="slide-image" src="assets/slides/slide-01.png" alt="Slide 1 of 19: Remortgaging at Monzo, 2025–26" width="1600" height="900" fetchpriority="high">
    </figure>
    <button class="arrow arrow-next" id="next-slide" type="button" aria-label="Next slide"><span aria-hidden="true">→</span></button>
  </div>
  <div class="slide-caption"><span class="caption-number" id="caption-number">01</span><span id="slide-title">Remortgaging at Monzo, 2025–26</span></div>
</main>
<footer class="bottombar">
  <div class="progress-track" role="progressbar" aria-label="Presentation progress" aria-valuemin="1" aria-valuemax="19" aria-valuenow="1"><span id="progress-fill"></span></div>
  <div class="control-row">
    <span class="keyboard-hint"><kbd>←</kbd><kbd>→</kbd> to move between slides</span>
    <div class="slide-controls">
      <button class="small-arrow" id="previous-bottom" type="button" aria-label="Previous slide">←</button>
      <span id="bottom-count">01 <i>/</i> 19</span>
      <button class="small-arrow" id="next-bottom" type="button" aria-label="Next slide">→</button>
      <button class="notes-bottom" id="open-notes-bottom" type="button">Open notes <span aria-hidden="true">↗</span></button>
    </div>
  </div>
</footer>
<dialog class="notes-sheet" id="notes-sheet" aria-labelledby="notes-heading">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-inner">
    <div class="sheet-heading">
      <div><span class="eyebrow">PRESENTER NOTES · DRAFT</span><h2 id="notes-heading">Slide 1</h2></div>
      <button class="close-notes" id="close-notes" type="button" aria-label="Close speaker notes">×</button>
    </div>
    <div class="sheet-progress"><span id="sheet-count">01 / 19</span><span>Use the arrows to change slides</span></div>
    <div class="notes-content" id="notes-content" tabindex="0"></div>
  </div>
</dialog>
</body>
</html>
