<section class="slide light" data-n="08" data-k="research">

<div style="position:relative;width:860px">
  <div class="eyebrow a">01 · The reset · what customers told us</div><h1 class="a" style="--d:1">Customers wanted one journey — but not the same one</h1>
  <ul class="findings">
    <li class="a" style="--d:3"><b>“Don’t send me out.”</b> They expected to <mark>get the new deal inside Monzo</mark>, not on another website.</li>
    <li class="a" style="--d:4"><b>“Use what you know.”</b> <mark>Reuse the data Monzo already holds</mark>, instead of asking again.</li>
    <li class="a" style="--d:5"><b>“Let me choose.”</b> Some wanted a call for reassurance; others wanted to <mark>self-serve, with a human on hand</mark>.</li>
    <li class="a" style="--d:6"><b>“Tell me what’s happening.”</b> <mark>The wait</mark> was the most stressful part.</li>
  </ul>
