const stack=[]; let curEl=null, busy=false, idleT=null, progW=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const EASE="cubic-bezier(.22,.9,.24,1)";
function fit(){const s=Math.min(1,(innerHeight-150)/894,(innerWidth-20)/422);document.documentElement.style.setProperty("--s",Math.max(.4,s).toFixed(4))}
addEventListener("resize",fit);fit();
Object.keys(S).forEach(k=>{const i=new Image();i.src=IMG(k)});
const cur=()=>stack[stack.length-1].k;

function crop(el,k,x,y,w,h){const d=S[k];el.style.backgroundImage="url("+IMG(k)+")";el.style.backgroundSize="402px "+d.h+"px";el.style.backgroundPosition=(-x)+"px "+(-y)+"px"}
function build(k){
  const d=S[k], el=document.createElement("div"); el.className="scr"; el.dataset.k=k;
  const sc=document.createElement("div"); sc.className="scroll"; const ct=document.createElement("div"); ct.className="content"; ct.style.height=d.h+"px";
  const im=document.createElement("img"); im.src=IMG(k); im.alt=d.l; im.width=402; im.draggable=false; ct.append(im); sc.append(ct); el.append(sc);
  el._sc=sc; el._ct=ct;
  let fx=null;
  if(d.fb){fx=document.createElement("div");fx.className="fix b";fx.style.height=d.fb+"px";fx.style.backgroundImage="url("+IMG(k)+")";el.append(fx)}
  if(d.h>884){const t=document.createElement("div");t.className="fix t";t.style.backgroundImage="url("+IMG(k)+")";el.append(t);
    const sb=document.createElement("div");sb.className="sbar";const vis=874-d.fb;sb.style.height=Math.max(36,vis*vis/d.h)+"px";el.append(sb);
    let ht=null;sc.addEventListener("scroll",()=>{const m=d.h-874, f=m>0?sc.scrollTop/m:0;sb.style.transform="translateY("+(62+f*(vis-62-parseFloat(sb.style.height)))+"px)";sb.classList.add("on");clearTimeout(ht);ht=setTimeout(()=>sb.classList.remove("on"),650)},{passive:true})}
  el._hs=[];
  d.hs.forEach(h=>{const b=document.createElement("button");b.className="hs"+(h.nc?" nc":"");b.type="button";
    b.setAttribute("aria-label",h.to==="BACK"?"Back":(S[h.to]?S[h.to].l:""));
    const inFix=d.fb&&h.y>=d.h-d.fb-1;
    b.style.cssText+="left:"+h.x+"px;width:"+h.w+"px;height:"+h.h+"px;top:"+(inFix?h.y-(d.h-d.fb):h.y)+"px;border-radius:"+Math.min(h.h/2,16)+"px";
    if(!h.nc)crop(b,k,h.x,h.y,h.w,h.h);
    b.style.setProperty("--ps",h.h<=60?.95:.985);
    const up=()=>b.classList.remove("pressed");
    b.addEventListener("pointerdown",()=>b.classList.add("pressed"));
    ["pointerup","pointerleave","pointercancel"].forEach(t=>b.addEventListener(t,up));
    b.addEventListener("click",e=>{e.stopPropagation();poke();if(el._playing){skipChat(el);return}setTimeout(()=>go(h.to,h.i),70)});
    b._h=h;(inFix?fx:ct).append(b);el._hs.push(b)});
  el.addEventListener("click",()=>{poke();if(el._playing){skipChat(el);return}el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("flash"),900)});
  return el}

/* chat: bubbles arrive one by one */
function prepChat(el,k){const c=S[k].chat; if(!c)return;
  const cv=document.createElement("div");cv.className="cover";cv.style.top=c.top+"px";cv.style.height=c.h+"px";el._ct.append(cv);
  el._runs=c.runs.map(r=>{const d=document.createElement("div");d.className="run";d.style.cssText+="left:"+r.x+"px;top:"+r.y+"px;width:"+r.w+"px;height:"+r.h+"px";crop(d,k,r.x,r.y,r.w,r.h);d._r=r;el._ct.append(d);return d});
  el._hs.forEach(b=>{const h=b._h;if(h.y>=c.top&&h.y<c.top+c.h&&!h.nc){const d=el._runs.find(x=>h.y>=x._r.y&&h.y<x._r.y+x._r.h);if(d){b.style.visibility="hidden";(d._hs=d._hs||[]).push(b)}}});
  el._typing=document.createElement("div");el._typing.className="typing";el._typing.innerHTML="<i></i><i></i><i></i>";el._ct.append(el._typing)}
function showRun(el,d,anim){const r=d._r;d.style.opacity=1;(d._hs||[]).forEach(b=>b.style.visibility="");
  if(anim)d.animate(r.t==="user"?[{opacity:0,transform:"translateY(14px) scale(.96)"},{opacity:1,transform:"none"}]:[{opacity:0,transform:"translateY(6px) scale(.97)"},{opacity:1,transform:"none"}],{duration:r.t==="user"?300:260,easing:EASE});
  d.style.transformOrigin=r.t==="user"?"100% 100%":"0 100%";
  const vis=874-(S[el.dataset.k].fb||0), t=r.y+r.h+14-vis; if(t>el._sc.scrollTop)el._sc.scrollTo({top:t,behavior:anim?"smooth":"auto"})}
async function playChat(el){if(!el._runs)return; el._playing=true; const tk=el._tk={};
  const live=()=>tk===el._tk&&el.isConnected;
  for(const d of el._runs){ if(!live())return; const r=d._r;
    if(r.t==="exp"){const ty=el._typing;ty.style.top=r.y+"px";ty.style.opacity=1;ty.animate([{opacity:0,transform:"scale(.9)"},{opacity:1,transform:"none"}],{duration:180,easing:EASE});
      const vis=874-(S[el.dataset.k].fb||0), t=r.y+54-vis; if(t>el._sc.scrollTop)el._sc.scrollTo({top:t,behavior:"smooth"});
      await wait(r.h>150?950:720); if(!live())return; ty.style.opacity=0}
    else await wait(r.t==="date"?150:420);
    if(!live())return; showRun(el,d,true); await wait(r.t==="date"?200:380)}
  el._playing=false; nudgeLater()}
function skipChat(el){el._tk={};el._playing=false;if(el._typing)el._typing.style.opacity=0;(el._runs||[]).forEach(d=>{if(d.style.opacity!=="1")showRun(el,d,false)});nudgeLater()}
function showChatAll(el){(el._runs||[]).forEach(d=>showRun(el,d,false))}

/* tracker bar fills up */
function playBar(el,k){const b=S[k].bar; if(!b||b.fw<14)return;
  const cv=document.createElement("div");cv.className="bcov";cv.style.cssText+="left:"+b.x+"px;top:"+b.y+"px;width:"+b.fw+"px;background:rgb("+b.track+")";
  const f=document.createElement("div");f.className="bfill";f.style.cssText+="left:"+b.x+"px;top:"+b.y+"px;width:"+b.fw+"px;background:rgb("+b.fill+");transform-origin:0 50%";
  el._ct.append(cv,f);
  f.animate([{transform:"scaleX(.04)"},{transform:"scaleX(1)"}],{duration:1100,delay:180,easing:"cubic-bezier(.3,.8,.3,1)",fill:"backwards"}).finished.then(()=>{cv.remove();f.remove()})}

/* transitions */
function settle(el){if(!el)return;el.getAnimations().forEach(a=>{try{a.commitStyles()}catch(_){}a.cancel()});el.style.transform='';el.style.opacity='';el.style.clipPath='';el.style.boxShadow='';el.querySelectorAll(':scope>.dim').forEach(d=>d.remove())}
const T=(el,kf,o)=>el.animate(kf,Object.assign({duration:420,easing:EASE,fill:"both"},o)).finished;
function dimOn(el,a,b,o){const d=document.createElement("div");d.className="dim";el.append(d);return T(d,[{opacity:a},{opacity:b}],o)}
function strip(k,top){const s=document.createElement("div");s.style.cssText="position:absolute;left:0;top:0;width:402px;height:"+top+"px;z-index:31;background:url("+IMG(k)+") 0 0/402px "+S[k].h+"px no-repeat";return s}
async function animate(oldEl,el,how){
  const nk=el.dataset.k, ok=oldEl&&oldEl.dataset.k;
  if(!oldEl||!how){view.insertBefore(el,inter);return}
  const under=["pop","unsheet","unalert","dismiss"].includes(how);
  if(under)view.insertBefore(el,oldEl);else view.insertBefore(el,inter);
  const P=[];
  if(how==="push"){el.style.boxShadow="-10px 0 30px rgba(0,0,0,.18)";P.push(T(el,[{transform:"translateX(100%)"},{transform:"none"}]),T(oldEl,[{transform:"none"},{transform:"translateX(-28%)"}]),dimOn(oldEl,0,.14))}
  else if(how==="pop"){oldEl.style.boxShadow="-10px 0 30px rgba(0,0,0,.18)";P.push(T(oldEl,[{transform:"none"},{transform:"translateX(100%)"}]),T(el,[{transform:"translateX(-28%)"},{transform:"none"}]),dimOn(el,.14,0))}
  else if(how==="sheet"){const top=S[nk].sheet||0, st=strip(nk,top);view.insertBefore(st,inter);el.style.clipPath="inset("+top+"px 0 0 0)";
    P.push(T(st,[{opacity:0},{opacity:1}],{duration:300,easing:"linear"}),T(el,[{transform:"translateY(100%)"},{transform:"none"}],{duration:460}),dimOn(oldEl,0,.25,{duration:300}));
    await Promise.all(P);st.remove();oldEl.remove();settle(el);return}
  else if(how==="unsheet"){const top=S[ok].sheet||0, st=strip(ok,top);view.insertBefore(st,inter);oldEl.style.clipPath="inset("+top+"px 0 0 0)";
    P.push(T(st,[{opacity:1},{opacity:0}],{duration:300,easing:"linear"}),T(oldEl,[{transform:"none"},{transform:"translateY(100%)"}],{duration:380,easing:"cubic-bezier(.4,0,.8,.4)"}));
    await Promise.all(P);st.remove();oldEl.remove();settle(el);return}
  else if(how==="alert"){const a=S[nk].alert, bx=document.createElement("div");bx.style.cssText="position:absolute;z-index:32;border-radius:18px;left:"+a[0]+"px;top:"+a[1]+"px;width:"+a[2]+"px;height:"+a[3]+"px";crop(bx,nk,a[0],a[1],a[2],a[3]);view.insertBefore(bx,inter);
    P.push(T(el,[{opacity:0},{opacity:1}],{duration:220,easing:"linear"}),T(bx,[{opacity:0,transform:"scale(1.12)"},{opacity:1,transform:"none"}],{duration:300}));
    await Promise.all(P);bx.remove();oldEl.remove();settle(el);return}
  else if(how==="unalert"){P.push(T(oldEl,[{opacity:1},{opacity:0}],{duration:200,easing:"linear"}))}
  else if(how==="modal"){el.style.boxShadow="0 -10px 30px rgba(0,0,0,.18)";P.push(T(el,[{transform:"translateY(100%)"},{transform:"none"}],{duration:480}),dimOn(oldEl,0,.25,{duration:480}))}
  else if(how==="dismiss"){P.push(T(oldEl,[{transform:"none"},{transform:"translateY(100%)"}],{duration:420,easing:"cubic-bezier(.4,0,.6,1)"}),dimOn(el,.25,0,{duration:420}))}
  else{P.push(T(el,[{opacity:0},{opacity:1}],{duration:how==="time"?520:320,easing:"linear"}))}
  await Promise.all(P);oldEl.remove();settle(el)}
const REV={push:"pop",pop:"push",sheet:"unsheet",alert:"unalert",modal:"dismiss",dismiss:"modal",time:"fade",fade:"fade"};
function howFor(from,to){return D.EDGE[from+">"+to]||D.TO[to]||"push"}

async function show(k,how,{label,forward=true}={}){
  if(busy)return; busy=true; clearTimeout(idleT);
  if(label){document.getElementById("interT").textContent=label;await T(inter,[{opacity:0},{opacity:1}],{duration:260,easing:"linear"})}
  const old=curEl, el=build(k); prepChat(el,k);
  if(el._runs&&!forward)showChatAll(el);
  curEl=el; ui(k);
  const p=animate(old,el,old?how:null);
  if(label){await wait(500);T(inter,[{opacity:1},{opacity:0}],{duration:340,easing:"linear"})}
  await p; busy=false;
  if(forward){playBar(el,k); if(el._runs)playChat(el); else nudgeLater()} else nudgeLater()}
function go(to,label){if(busy)return; if(to==="BACK")return back(); if(!S[to])return;
  const how=howFor(cur(),to); stack.push({k:to,how}); show(to,how,{label:label||null})}
function back(){if(busy||stack.length<2)return; const top=stack.pop(); show(cur(),REV[top.how]||"pop",{forward:false})}
function restart(){if(busy)return; stack.length=0; stack.push({k:D.START,how:null}); show(D.START,"fade")}
function next(){if(busy)return; if(curEl&&curEl._playing){skipChat(curEl);return}
  const k=cur(), d=S[k]; if(k===MAIN[MAIN.length-1])return restart(); if(!d.n)return; go(d.n,d.ni)}
function ui(k){const d=S[k], i=MAIN.indexOf(k), lab=document.getElementById("lab"), st=document.getElementById("step");
  lab.animate([{opacity:0,transform:"translateY(4px)"},{opacity:1,transform:"none"}],{duration:280,easing:EASE});
  lab.textContent=d.l; st.textContent=i>=0?("Step "+(i+1)+" of "+MAIN.length):"Side path";
  if(i>=0)progW=(i+1)/MAIN.length*100; document.getElementById("prog").style.width=progW+"%";
  document.getElementById("back").disabled=stack.length<2;
  document.getElementById("next").textContent=k===MAIN[MAIN.length-1]?"Start again ↺":"Next ›"}
function poke(){clearTimeout(idleT);if(curEl)curEl._hs.forEach(b=>b.classList.remove("nudge"));nudgeLater()}
function nudgeLater(){clearTimeout(idleT);idleT=setTimeout(()=>{if(!curEl||curEl._playing||busy)return;const b=curEl._hs.find(x=>x._h.p);if(b){b.classList.remove("nudge");void b.offsetWidth;b.classList.add("nudge")}nudgeLater()},4500)}

/* swipe back from the left edge */
let drag=null;
view.addEventListener("pointerdown",e=>{if(busy||stack.length<2)return;const top=stack[stack.length-1];if(top.how!=="push")return;
  const r=view.getBoundingClientRect(), s=r.width/402, x=(e.clientX-r.left)/s; if(x>26)return;
  drag={x0:e.clientX,s,t0:performance.now(),prev:null,dx:0,id:e.pointerId}});
view.addEventListener("pointermove",e=>{if(!drag)return;const dx=Math.max(0,(e.clientX-drag.x0)/drag.s);drag.dx=dx;
  if(!drag.prev&&dx>6){try{view.setPointerCapture(drag.id)}catch(_){}const pk=stack[stack.length-2].k;drag.prev=build(pk);prepChat(drag.prev,pk);showChatAll(drag.prev);view.insertBefore(drag.prev,curEl);curEl.style.boxShadow="-10px 0 30px rgba(0,0,0,.18)"}
  if(drag.prev){curEl.style.transform="translateX("+dx+"px)";drag.prev.style.transform="translateX("+(-0.28*402+dx*0.28)+"px)"}});
const endDrag=async e=>{if(!drag)return;const d=drag;drag=null;if(!d.prev)return;
  const v=d.dx/Math.max(1,performance.now()-d.t0), done=d.dx>130||(v>.45&&d.dx>40); busy=true;
  const o={duration:260,easing:"cubic-bezier(.2,.8,.2,1)",fill:"forwards"};
  if(done){await Promise.all([curEl.animate([{transform:curEl.style.transform},{transform:"translateX(402px)"}],o).finished,d.prev.animate([{transform:d.prev.style.transform},{transform:"none"}],o).finished]);
    curEl.remove();stack.pop();curEl=d.prev;settle(curEl);ui(cur());busy=false;nudgeLater()}
  else{await Promise.all([curEl.animate([{transform:curEl.style.transform},{transform:"none"}],o).finished,d.prev.animate([{transform:d.prev.style.transform},{transform:"translateX(-28%)"}],o).finished]);
    d.prev.remove();settle(curEl);busy=false}};
view.addEventListener("pointerup",endDrag);view.addEventListener("pointercancel",endDrag);

document.getElementById("back").onclick=back; document.getElementById("next").onclick=next;
addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" "||e.key==="Enter"){e.preventDefault();next()}else if(e.key==="ArrowLeft"||e.key==="Backspace"){e.preventDefault();back()}
  else if(e.key==="Escape"&&parent!==window){parent.postMessage("feb-proto-close","*")}
  else if((e.key==="ArrowDown"||e.key==="ArrowUp")&&curEl){e.preventDefault();curEl._sc.scrollBy({top:e.key==="ArrowDown"?180:-180,behavior:"smooth"})}});
addEventListener("pointerdown",poke,{passive:true});
stack.push({k:D.START,how:null}); show(D.START,null);
</script></body></html>
