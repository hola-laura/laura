<style>
html,body{background:#112231!important}
body.is-journey{min-height:100vh}
.is-journey .mg-tracker{min-height:100vh;align-content:center;grid-template-columns:minmax(0,420px) auto!important;justify-content:center!important;gap:72px!important;padding:24px!important}
.is-journey .mg-tk-phone{width:calc((100vh - 48px) / 2.113)!important}
.jr-head{margin:0 0 22px}
.jr-kicker{font:13px/1.2 "Fragment Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#ff6b5a;margin:0 0 10px}
.jr-title{font:700 34px/1.12 "DM Sans",Inter,sans-serif;color:#fff;margin:0 0 12px;letter-spacing:-.01em}
.jr-note{font:400 16px/1.45 "DM Sans",Inter,sans-serif;color:#a9bac4;margin:0;max-width:380px}
.is-journey .mg-tk-bar{display:flex;flex-wrap:wrap;gap:10px!important}
.jr-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.28);background:transparent;color:#fff;font:600 15px/1 "DM Sans",Inter,sans-serif;cursor:pointer}
.jr-btn:hover{background:rgba(255,255,255,.08)}
.jr-btn[aria-pressed="true"]{background:#fff;color:#112231;border-color:#fff}
.jr-btn.is-main{background:#d8f16a;color:#112231;border-color:#d8f16a}
.jr-btn[hidden]{display:none}
.fl-screen{touch-action:none;cursor:pointer;user-select:none}
.fl-screen img{pointer-events:none;-webkit-user-drag:none}
.jr-hot{position:absolute;z-index:8;border-radius:14px;border:2.5px solid #2f80ff;background:rgba(47,128,255,.16);opacity:0;pointer-events:none;transition:opacity .2s}
.jr-hot.is-on{opacity:.9}
.jr-hot.is-flash{animation:jrFlash 1.1s ease}
@keyframes jrFlash{0%,100%{opacity:0}15%,70%{opacity:1}}
</style></head>
