<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Illustrative comparison of the Monzo Flex payment flow before and after the redesign</title>
<desc id="desc">Before, customers move between separate purchase plans and a separate manage area. After, one Flex account view connects balance and upcoming payments to a payment action and a clear explanation of its consequences.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#806998"/></marker></defs>
<rect width="1200" height="620" rx="28" fill="#f7f4fa"/>
<text x="56" y="62" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#6d4793">BEFORE · SEPARATE ACTIONS</text>
<text x="646" y="62" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#6d4793">AFTER · ONE CLEARER JOURNEY</text>
<line x1="600" y1="40" x2="600" y2="580" stroke="#ded6e8" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<rect x="56" y="112" width="220" height="110" rx="18" fill="#fff" stroke="#ded6e8" stroke-width="2"/>
<text x="82" y="154" font-size="17" fill="#635c6b">Purchase plan 01</text><text x="82" y="188" font-size="14" fill="#8a8290">Repayment action</text>
<rect x="56" y="252" width="220" height="110" rx="18" fill="#fff" stroke="#ded6e8" stroke-width="2"/>
<text x="82" y="294" font-size="17" fill="#635c6b">Purchase plan 02</text><text x="82" y="328" font-size="14" fill="#8a8290">Repayment action</text>
<rect x="56" y="392" width="220" height="110" rx="18" fill="#fff" stroke="#ded6e8" stroke-width="2"/>
<text x="82" y="434" font-size="17" fill="#635c6b">Purchase plan 03+</text><text x="82" y="468" font-size="14" fill="#8a8290">More to manage one by one</text>
<path d="M294 166H356M294 306H356M294 446H356" stroke="#a89ab5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="374" y="222" width="190" height="168" rx="22" fill="#eee8f4" stroke="#cfc3dc" stroke-width="2"/>
<text x="469" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#4a3b58">Manage tab</text>
<text x="469" y="306" text-anchor="middle" font-size="14" fill="#635c6b">Actions apart from</text>
<text x="469" y="331" text-anchor="middle" font-size="14" fill="#635c6b">the account balance</text>
<text x="469" y="362" text-anchor="middle" font-size="13" fill="#806998">Separate context</text>
<rect x="646" y="112" width="498" height="116" rx="20" fill="#fff" stroke="#cfc3dc" stroke-width="2"/>
<text x="678" y="151" font-size="17" font-weight="700" fill="#4a3b58">Flex account</text>
<text x="678" y="184" font-size="14" fill="#635c6b">Balance · available limit · next payment · activity</text>
<path d="M895 238V276" stroke="#806998" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="646" y="292" width="498" height="88" rx="20" fill="#e9e2f0"/>
<text x="678" y="327" font-size="16" font-weight="700" fill="#4a3b58">Choose a payment action</text>
<text x="678" y="354" font-size="14" fill="#635c6b">Pay early · pay the whole balance · view payments</text>
<path d="M895 390V428" stroke="#806998" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="646" y="444" width="498" height="116" rx="20" fill="#e3eee8" stroke="#c4d9cf" stroke-width="2"/>
<text x="678" y="482" font-size="16" font-weight="700" fill="#29473b">See what changes before confirming</text>
<text x="678" y="512" font-size="14" fill="#456154">Remaining balance · interest saving · next-payment effect</text>
<text x="678" y="540" font-size="13" fill="#456154">Clear consequence, then confirm</text>
</g>
</svg>